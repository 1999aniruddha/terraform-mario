apiVersion: apps/v1
kind: Deployment
metadata:
  name: mario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mario
  template:
    metadata:
      labels:
        app: mario
    spec:
      containers:
        - name: mario
          image: 985124894155.dkr.ecr.us-east-1.amazonaws.com/mario-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
